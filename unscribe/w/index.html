<link rel="canonical" href="/unscribe/?utm_source=threads&utm_medium=social&utm_campaign=w&utm_content=unscribe">
<script>
(function () {
  // App + channel short hop (same UTM pattern as /cw). Bio links stay /t /f /i → hub.
  var hop = '/unscribe/w';
  var dest = '/unscribe/?utm_source=threads&utm_medium=social&utm_campaign=w&utm_content=unscribe';
  var ref = document.referrer || '';
  var host = '';
  try { host = ref ? new URL(ref).hostname : ''; } catch (e) {}
  var body = JSON.stringify({
    page: hop,
    referrer_host: (host || 'www.threads.net').slice(0, 120),
    referrer_raw: ('utm:threads|social|w|unscribe | ' + ref).slice(0, 500),
    user_agent: (navigator.userAgent || '').slice(0, 300),
    session_id: Math.random().toString(36).slice(2, 10),
    source: 'threads'
  });
  try {
    navigator.sendBeacon(
      'https://josspatech.pockethost.io/api/collections/_site_visits/records',
      new Blob([body], { type: 'text/plain;charset=UTF-8' })
    );
  } catch (e) {}
  location.replace(dest);
})();
</script>
