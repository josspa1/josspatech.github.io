<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JosspaTech Brand</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0C3358;--gold:#F0C040;--cyan:#5DADE2;--paper:#f3f6f9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--navy);line-height:1.5}
  .hero{
    background:linear-gradient(165deg,#06111c 0%,#0C3358 50%,#1A4F7A 100%);
    color:#fff;padding:72px 24px 64px;text-align:center;
  }
  .hero-mark{width:148px;height:148px;margin:0 auto 28px;display:block}
  .hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(34px,6vw,52px);letter-spacing:-1.5px;margin-bottom:8px}
  .hero h1 span{color:var(--gold)}
  .hero .tag{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:rgba(240,192,64,.85);margin-bottom:18px}
  .hero p{max-width:32rem;margin:0 auto;color:rgba(255,255,255,.62);font-size:16px}
  main{max-width:880px;margin:0 auto;padding:40px 18px 80px}
  h2{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin:0 0 10px}
  .lead{color:#5a7390;margin-bottom:22px;max-width:42rem}
  .card{background:#0C3358;border-radius:18px;padding:28px 16px;text-align:center;color:#fff;margin-bottom:18px}
  .card h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:rgba(240,192,64,.85);margin-bottom:16px}
  .card svg{width:112px;height:112px;display:block;margin:0 auto}
  .card p{font-size:13px;color:rgba(255,255,255,.62);margin-top:14px}
  .lockup{margin-top:14px;background:#0C3358;border-radius:18px;padding:28px;text-align:center}
  .lockup.light{background:#fff;border:1px solid rgba(12,51,88,.1)}
  .lockup svg{width:min(420px,100%);height:auto}
  a.back{display:inline-block;margin-top:32px;font-weight:700;color:#1A4F7A;text-decoration:none}
</style>
</head>
<body>

<section class="hero">
  <svg class="hero-mark" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="#5DADE2" stroke-linecap="round">
      <line x1="12" y1="110" x2="94" y2="34" stroke-width="4.5"/>
      <line x1="20" y1="116" x2="92" y2="40" stroke-width="2.6" opacity="0.7"/>
      <line x1="6" y1="102" x2="90" y2="30" stroke-width="2" opacity="0.45"/>
    </g>
    <circle cx="58" cy="68" r="24" fill="#F0C040"/>
    <path d="M100,22 104.4,31.6 114,36 104.4,40.4 100,50 95.6,40.4 86,36 95.6,31.6 Z" fill="#7EC8EB"/>
  </svg>
  <div class="tag">Live mark</div>
  <h1>Josspa<span>Tech</span></h1>
  <p>Straight trail through the sun’s face. Star about to rocket past.</p>
</section>

<main>
  <h2>Shooting star</h2>
  <p class="lead">No orbit. The path is a straight line; the sun sits on that path; the star is whipping past the sun’s face.</p>

  <div class="card">
    <h3>JosspaTech mark</h3>
    <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#5DADE2" stroke-linecap="round">
        <line x1="12" y1="110" x2="94" y2="34" stroke-width="4.5"/>
        <line x1="20" y1="116" x2="92" y2="40" stroke-width="2.6" opacity="0.7"/>
        <line x1="6" y1="102" x2="90" y2="30" stroke-width="2" opacity="0.45"/>
      </g>
      <circle cx="58" cy="68" r="24" fill="#F0C040"/>
      <path d="M100,22 104.4,31.6 114,36 104.4,40.4 100,50 95.6,40.4 86,36 95.6,31.6 Z" fill="#7EC8EB"/>
    </svg>
    <p>josspatech-mark.svg</p>
  </div>

  <h2>Lockups</h2>
  <div class="lockup">
    <svg viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JosspaTech">
      <g transform="translate(8 8) scale(0.95)">
        <g stroke="#5DADE2" stroke-linecap="round">
          <line x1="12" y1="110" x2="94" y2="34" stroke-width="4.5"/>
          <line x1="20" y1="116" x2="92" y2="40" stroke-width="2.6" opacity="0.7"/>
          <line x1="6" y1="102" x2="90" y2="30" stroke-width="2" opacity="0.45"/>
        </g>
        <circle cx="58" cy="68" r="24" fill="#F0C040"/>
        <circle cx="52" cy="62" r="5" fill="#FFF3C4" opacity="0.65"/>
        <path d="M100,22 104.4,31.6 114,36 104.4,40.4 100,50 95.6,40.4 86,36 95.6,31.6 Z" fill="#7EC8EB"/>
      </g>
      <text x="150" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">Josspa<tspan fill="#F0C040">Tech</tspan></text>
      <text x="152" y="104" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.4" fill="rgba(255,255,255,0.55)">FEWER APPS. BETTER APPS.</text>
    </svg>
  </div>
  <div class="lockup light" style="margin-top:12px">
    <svg viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JosspaTech light">
      <g transform="translate(8 8) scale(0.95)">
        <g stroke="#1A4F7A" stroke-linecap="round">
          <line x1="12" y1="110" x2="94" y2="34" stroke-width="4.5"/>
          <line x1="20" y1="116" x2="92" y2="40" stroke-width="2.6" opacity="0.75"/>
          <line x1="6" y1="102" x2="90" y2="30" stroke-width="2" opacity="0.5"/>
        </g>
        <circle cx="58" cy="68" r="24" fill="#E8A820"/>
        <circle cx="52" cy="62" r="5" fill="#FFF3C4" opacity="0.65"/>
        <path d="M100,22 104.4,31.6 114,36 104.4,40.4 100,50 95.6,40.4 86,36 95.6,31.6 Z" fill="#2E6FA3"/>
      </g>
      <text x="150" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#0C3358">Josspa<tspan fill="#C99212">Tech</tspan></text>
      <text x="152" y="104" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.4" fill="#5A7390">FEWER APPS. BETTER APPS.</text>
    </svg>
  </div>

  <a class="back" href="/">Back to josspatech.com</a>
</main>
</body>
</html>
