<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="JosspaTech">
  <!--
    POLAR — primary mark
    Built from iconic-logo common traits:
    1) One silhouette (drawable from memory)
    2) One signature detail (gold apex)
    3) Scales to 16px without losing identity
    4) Works in mono (navy or white)
    5) Timeless geometry, not trend ornament
  -->
  <defs>
    <linearGradient id="p-body" x1="0.2" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#2E6FA3"/>
      <stop offset="45%" stop-color="#1A4F7A"/>
      <stop offset="100%" stop-color="#0C3358"/>
    </linearGradient>
    <linearGradient id="p-gold" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="50%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#C99212"/>
    </linearGradient>
  </defs>
  <!-- Body diamond -->
  <polygon points="64,14 116,64 64,114 12,64" fill="url(#p-body)"/>
  <!-- Soft facet highlight (still one silhouette) -->
  <polygon points="64,14 116,64 64,64" fill="#FFFFFF" opacity="0.12"/>
  <!-- Signature gold apex diamond -->
  <polygon points="64,8 78,28 64,36 50,28" fill="url(#p-gold)"/>
</svg>
