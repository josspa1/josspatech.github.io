  <path d="M57.2,57.0 57.5,62.8 57.0,68.2 58.4,71.0 61.0,71.6" stroke="#B8860B" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.48"/>
  <path d="M60.6,56.4 66.0,56.1 71.2,56.8 M66.0,56.1 66.2,70.2" stroke="#B8860B" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.48"/>
  <ellipse cx="64" cy="64" rx="44" ry="19.5" stroke="#5DADE2" stroke-width="4.5" transform="rotate(-28 64 64)"/>
  <!-- Primary star (upper-right) -->
  <path d="M97.4,31.9 100.3,37.0 105.4,39.9 100.3,42.8 97.4,47.9 94.5,42.8 89.4,39.9 94.5,37.0 Z" fill="#7EC8EB"/>
