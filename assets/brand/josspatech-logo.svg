    <rect x="0" y="0" width="112" height="112" rx="28" fill="none" stroke="#F0C040" stroke-width="1.25" opacity="0.35"/>
    <path d="M62 26 V70 C62 82 54 90 42 90 C32 90 26 85 23 78"
