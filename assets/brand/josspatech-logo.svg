    <line x1="2" y1="78" x2="112" y2="78" stroke="#F0C040" stroke-width="1.5" stroke-linecap="round"/>
    <text x="2" y="100" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3.2" fill="rgba(255,255,255,0.55)">FEWER APPS. BETTER APPS.</text>
