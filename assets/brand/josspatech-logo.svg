<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-label="JosspaTech  Fewer apps. Better apps.">
  <defs>
    <linearGradient id="lg-facet" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#9AD4F0"/>
      <stop offset="42%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#2E7EB0"/>
    </linearGradient>
    <linearGradient id="lg-core" x1="0.3" y1="0.2" x2="0.75" y2="0.9">
      <stop offset="0%" stop-color="#7EC8EB"/>
      <stop offset="100%" stop-color="#3A90C4"/>
    </linearGradient>
    <radialGradient id="lg-star" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="55%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#C99212"/>
    </radialGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(4 4)">
    <circle cx="60" cy="60" r="54" fill="none" stroke="#5DADE2" stroke-width="0.7" opacity="0.2"/>
    <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.14">
      <line x1="60" y1="60" x2="104" y2="28" stroke-width="1"/>
      <line x1="60" y1="60" x2="16" y2="94" stroke-width="1"/>
      <line x1="60" y1="60" x2="110" y2="74" stroke-width="0.75"/>
      <line x1="60" y1="60" x2="14" y2="36" stroke-width="0.75"/>
    </g>
    <polygon points="60,16 96,60 60,104 24,60" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
    <polygon points="60,24 88,60 60,96 32,60" fill="url(#lg-facet)" opacity="0.22" stroke="#5DADE2" stroke-width="1.1"/>
    <polygon points="60,34 80,60 60,86 40,60" fill="url(#lg-core)" stroke="#7EC8EB" stroke-width="0.85"/>
    <polygon points="60,34 80,60 60,60" fill="#FFFFFF" opacity="0.18"/>
    <polygon points="60,44 70,60 60,76 50,60" fill="#5DADE2"/>
    <polygon points="60,48 66,60 60,72 54,60" fill="#9AD4F0" opacity="0.92"/>
    <g transform="translate(60 14)">
      <circle cx="0" cy="0" r="7" fill="url(#lg-star)"/>
      <path d="M0,-5.6 L1.25,-1.45 L5.6,0 L1.25,1.45 L0,5.6 L-1.25,1.45 L-5.6,0 L-1.25,-1.45 Z" fill="#FFF6D0"/>
    </g>
    <circle cx="104" cy="30" r="2.8" fill="#F0C040"/>
    <circle cx="18" cy="92" r="2.2" fill="#5DADE2"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(148 0)">
    <text x="0" y="68" font-family="Georgia, 'Times New Roman', Times, serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">Josspa<tspan fill="#F0C040">Tech</tspan><tspan fill="#F0C040" font-size="22" baseline-shift="18">"</tspan></text>
    <line x1="2" y1="82" x2="118" y2="82" stroke="#F0C040" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    <text x="2" y="104" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3.2" fill="rgba(255,255,255,0.55)">FEWER APPS. BETTER APPS.</text>
  </g>
