<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-label="JosspaTech — Fewer apps. Better apps.">
  <defs>
    <linearGradient id="lg-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163F66"/>
      <stop offset="100%" stop-color="#0C3358"/>
    </linearGradient>
    <linearGradient id="lg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D060"/>
      <stop offset="100%" stop-color="#E8A820"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 4)">
