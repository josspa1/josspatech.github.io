<!--
  PAL app icon — sage field + gold doubloon with debossed P.
  Ledger book stamp removed: it read as B at icon size (looked like BAL).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PAL">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6A8A78"/>
      <stop offset="45%" stop-color="#5B7B6A"/>
      <stop offset="100%" stop-color="#243830"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.3" y1="0.05" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#E2C44E"/>
      <stop offset="42%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#B08E1A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="55%" stop-color="#A8871C"/>
      <stop offset="100%" stop-color="#8F7114"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.42" cy="0.32" r="0.58">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="230" rx="200" ry="170" fill="url(#spot)"/>

  <g transform="translate(256 256)">
    <circle r="168" fill="url(#rim)"/>
    <circle r="148" fill="url(#gold)"/>
    <ellipse cx="-18" cy="-42" rx="82" ry="38" fill="#F0DC78" opacity="0.16"/>

    <g fill="none">
      <circle r="132" stroke="#D4B84A" stroke-width="2.2" transform="translate(2 2)" opacity="0.65"/>
      <circle r="132" stroke="#241C04" stroke-width="2.6" transform="translate(-2 -2)" opacity="1"/>
    </g>

    <g transform="scale(1.05)">
      <path fill="#241C04" opacity="0.78" d="M-34 -52 H-14 V52 H-34 Z M-14 -52 H18 C44 -52 44 -22 44 0 C44 22 18 22 -4 22 H-14 V2 H4 C20 2 20 -8 20 -8 C20 -28 20 -28 4 -28 H-14 V-52 Z"/>
      <path fill="#D8BC52" opacity="0.38" transform="translate(2.4 2.4)" d="M-34 -52 H-14 V52 H-34 Z M-14 -52 H18 C44 -52 44 -22 44 0 C44 22 18 22 -4 22 H-14 V2 H4 C20 2 20 -8 20 -8 C20 -28 20 -28 4 -28 H-14 V-52 Z"/>
    </g>
  </g>
</svg>
