<!--
  B - Ledger Doubloon
  Deboss stamp shading (light top-left): each groove is a thin dark lip + thin light wall.
  Wider pair offset so bevel survives anti-aliasing at icon sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PAL doubloon">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6A8A78"/>
      <stop offset="45%" stop-color="#5B7B6A"/>
      <stop offset="100%" stop-color="#243830"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.3" y1="0.05" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#E2C44E"/>
      <stop offset="42%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#B08E1A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="55%" stop-color="#A8871C"/>
      <stop offset="100%" stop-color="#8F7114"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.42" cy="0.32" r="0.58">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="230" rx="200" ry="170" fill="url(#spot)"/>

  <g transform="translate(256 256)">
    <circle r="168" fill="url(#rim)"/>
    <circle r="148" fill="url(#gold)"/>
    <ellipse cx="-18" cy="-42" rx="82" ry="38" fill="#F0DC78" opacity="0.16"/>

    <!-- Mint ring: light / dark pair -->
    <g fill="none">
      <circle r="132" stroke="#E2C85A" stroke-width="2.2" transform="translate(2 2)" opacity="0.85"/>
      <circle r="132" stroke="#8A6E12" stroke-width="2.2" transform="translate(-2 -2)" opacity="0.95"/>
    </g>

    <rect x="-52" y="-66" width="104" height="132" rx="8" fill="#B08E1A" opacity="0.2"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lit far wall of the cut -->
      <g transform="translate(2.2 2.2)" stroke="#E4CC5E" stroke-width="2.4" opacity="0.92">
        <rect x="-54" y="-68" width="108" height="136" rx="9"/>
        <path d="M28 -68 L54 -68 L28 -42"/>
        <path d="M-30 -50 V50"/>
        <path d="M-16 -28 H42"/>
        <path d="M-16 0 H42"/>
        <path d="M-16 28 H34"/>
      </g>
      <!-- Shadow lip toward light -->
      <g transform="translate(-2.2 -2.2)" stroke="#8A6E12" stroke-width="2.4" opacity="0.95">
        <rect x="-54" y="-68" width="108" height="136" rx="9"/>
        <path d="M28 -68 L54 -68 L28 -42"/>
        <path d="M-30 -50 V50"/>
        <path d="M-16 -28 H42"/>
        <path d="M-16 0 H42"/>
        <path d="M-16 28 H34"/>
      </g>
    </g>

    <path d="M28 -68 L54 -68 L28 -42 Z" fill="#8A6E12" opacity="0.5"/>
    <path d="M30 -65 L50 -65 L30 -45 Z" fill="#E2C85A" opacity="0.4"/>
  </g>
</svg>
