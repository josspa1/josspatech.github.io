<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper watermark compare (local)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #060d16; color: #fff; font-family: system-ui, sans-serif; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; padding: 16px 20px 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 14px 24px; }
  .panel {
    position: relative; overflow: hidden; border-radius: 18px; min-height: 420px;
    border: 1px solid rgba(255,255,255,0.12);
    background:
      radial-gradient(ellipse 80% 55% at 18% 0%, rgba(240,192,64,0.12), transparent 55%),
      linear-gradient(155deg, #114066 0%, #154872 40%, #0d3252 100%);
  }
  .label {
    position: absolute; top: 10px; left: 12px; z-index: 5;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(0,0,0,0.45); padding: 5px 8px; border-radius: 6px;
  }
  .phone {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: 150px; z-index: 3;
    border-radius: 22px; padding: 8px 8px 10px;
    background: linear-gradient(165deg, #2a2a2e, #0c0c0e);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
  }
  .phone img { display: block; width: 100%; border-radius: 14px; }
  /* A — giant wordmark */
  .wm-word {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-style: italic;
    font-size: clamp(42px, 7vw, 64px); letter-spacing: -0.04em;
    color: rgba(240, 192, 64, 0.11); white-space: nowrap; user-select: none;
  }
  /* B — JosspaTech mark */
  .wm-mark {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    width: min(78%, 280px); opacity: 0.12; z-index: 1; pointer-events: none;
    filter: grayscale(0.2);
  }
  /* C — short initials */
  .wm-initials {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-family: "Playfair Display", Georgia, serif; font-weight: 900;
    font-size: clamp(96px, 18vw, 140px); letter-spacing: -0.08em;
    color: rgba(255, 255, 255, 0.06); user-select: none;
  }
  /* D — mark + soft word under */
  .wm-combo-mark {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
    width: min(52%, 180px); opacity: 0.1; z-index: 1; pointer-events: none;
  }
  .wm-combo-word {
    position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%);
    z-index: 1; pointer-events: none;
    font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-style: italic;
    font-size: clamp(28px, 4.5vw, 40px); letter-spacing: -0.03em;
    color: rgba(240, 192, 64, 0.13); white-space: nowrap; user-select: none;
  }
</style>
</head>
<body>
  <h1>Wallpaper under phone — pick one</h1>
  <div class="grid">
    <div class="panel" id="a">
      <div class="label">A · Giant wordmark</div>
      <div class="wm-word" aria-hidden="true">PocketBudJet</div>
      <div class="phone"><img src="/videos/pbj/intro/screens/budget-live.jpg" alt=""></div>
    </div>
    <div class="panel" id="b">
      <div class="label">B · JosspaTech mark</div>
      <img class="wm-mark" src="/assets/brand/josspatech-mark.svg" alt="">
      <div class="phone"><img src="/videos/pbj/intro/screens/budget-live.jpg" alt=""></div>
    </div>
    <div class="panel" id="c">
      <div class="label">C · Initials wash</div>
      <div class="wm-initials" aria-hidden="true">PBJ</div>
      <div class="phone"><img src="/videos/pbj/intro/screens/budget-live.jpg" alt=""></div>
    </div>
    <div class="panel" id="d">
      <div class="label">D · Mark + word</div>
      <img class="wm-combo-mark" src="/assets/brand/josspatech-mark.svg" alt="">
      <div class="wm-combo-word" aria-hidden="true">PocketBudJet</div>
      <div class="phone"><img src="/videos/pbj/intro/screens/budget-live.jpg" alt=""></div>
    </div>
  </div>
</body>
</html>
