<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" width="400" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Phone frame -->
  <rect x="0" y="0" width="400" height="760" rx="32" fill="#202124"/>
  <rect x="8" y="8" width="384" height="744" rx="26" fill="#f5f7fa"/>

  <!-- Status bar -->
  <rect x="8" y="8" width="384" height="28" fill="#f5f7fa"/>
  <text x="24" y="26" font-size="12" font-weight="600" fill="#202124">9:41</text>
  <circle cx="370" cy="22" r="4" fill="#202124"/>
  <rect x="350" y="18" width="14" height="8" rx="1" fill="none" stroke="#202124" stroke-width="1"/>
  <rect x="352" y="20" width="9" height="4" fill="#202124"/>

  <!-- Bank app top bar -->
  <rect x="8" y="36" width="384" height="56" fill="#1a7f5a"/>
  <text x="24" y="72" font-size="22" font-weight="500" fill="#ffffff">←</text>
  <text x="60" y="72" font-size="17" font-weight="600" fill="#ffffff">Statements</text>

  <!-- Account header -->
  <rect x="8" y="92" width="384" height="80" fill="#ffffff"/>
  <text x="24" y="120" font-size="14" fill="#5f6368">Checking • ****4821</text>
  <text x="24" y="148" font-size="22" font-weight="700" fill="#202124">$3,247.18</text>
  <text x="24" y="166" font-size="11" fill="#5f6368">Available balance</text>

  <!-- Section label -->
  <rect x="8" y="172" width="384" height="34" fill="#f5f7fa"/>
  <text x="24" y="194" font-size="12" font-weight="600" fill="#5f6368" letter-spacing="0.5">RECENT STATEMENTS</text>

  <!-- Statement row 1 (highlighted — tap target) -->
  <rect x="8" y="206" width="384" height="76" fill="#ffffff"/>
  <rect x="8" y="206" width="4" height="76" fill="#1a7f5a"/>
  <rect x="24" y="222" width="44" height="44" rx="6" fill="#fce8e8"/>
  <text x="38" y="248" font-size="11" font-weight="700" fill="#c5302d">PDF</text>
  <text x="84" y="238" font-size="15" font-weight="600" fill="#202124">April 2026 Statement</text>
  <text x="84" y="258" font-size="13" fill="#5f6368">Mar 25 – Apr 24, 2026</text>
  <text x="84" y="274" font-size="12" fill="#5f6368">31 transactions</text>
  <text x="360" y="248" font-size="18" fill="#bdc1c6" text-anchor="middle">:</text>

  <!-- Statement row 2 -->
  <rect x="8" y="282" width="384" height="76" fill="#ffffff"/>
  <line x1="24" y1="282" x2="376" y2="282" stroke="#e8eaed"/>
  <rect x="24" y="298" width="44" height="44" rx="6" fill="#fce8e8"/>
  <text x="38" y="324" font-size="11" font-weight="700" fill="#c5302d">PDF</text>
  <text x="84" y="314" font-size="14" font-weight="500" fill="#202124">March 2026 Statement</text>
  <text x="84" y="334" font-size="12" fill="#5f6368">Feb 25 – Mar 24, 2026</text>
  <text x="360" y="324" font-size="18" fill="#bdc1c6" text-anchor="middle">:</text>

  <!-- Statement row 3 -->
  <rect x="8" y="358" width="384" height="76" fill="#ffffff"/>
  <line x1="24" y1="358" x2="376" y2="358" stroke="#e8eaed"/>
  <rect x="24" y="374" width="44" height="44" rx="6" fill="#fce8e8"/>
  <text x="38" y="400" font-size="11" font-weight="700" fill="#c5302d">PDF</text>
  <text x="84" y="390" font-size="14" font-weight="500" fill="#202124">February 2026 Statement</text>
  <text x="84" y="410" font-size="12" fill="#5f6368">Jan 25 – Feb 24, 2026</text>
  <text x="360" y="400" font-size="18" fill="#bdc1c6" text-anchor="middle">:</text>

  <!-- Statement row 4 -->
  <rect x="8" y="434" width="384" height="76" fill="#ffffff"/>
  <line x1="24" y1="434" x2="376" y2="434" stroke="#e8eaed"/>
  <rect x="24" y="450" width="44" height="44" rx="6" fill="#fce8e8"/>
  <text x="38" y="476" font-size="11" font-weight="700" fill="#c5302d">PDF</text>
  <text x="84" y="466" font-size="14" font-weight="500" fill="#202124">January 2026 Statement</text>
  <text x="84" y="486" font-size="12" fill="#5f6368">Dec 25 – Jan 24, 2026</text>
  <text x="360" y="476" font-size="18" fill="#bdc1c6" text-anchor="middle">:</text>

  <!-- Statement row 5 -->
  <rect x="8" y="510" width="384" height="76" fill="#ffffff"/>
  <line x1="24" y1="510" x2="376" y2="510" stroke="#e8eaed"/>
  <rect x="24" y="526" width="44" height="44" rx="6" fill="#fce8e8"/>
  <text x="38" y="552" font-size="11" font-weight="700" fill="#c5302d">PDF</text>
  <text x="84" y="542" font-size="14" font-weight="500" fill="#202124">December 2025 Statement</text>
  <text x="84" y="562" font-size="12" fill="#5f6368">Nov 25 – Dec 24, 2025</text>
  <text x="360" y="552" font-size="18" fill="#bdc1c6" text-anchor="middle">:</text>

  <!-- Hint footer -->
  <rect x="8" y="700" width="384" height="52" fill="#eef5f1"/>
  <text x="200" y="724" font-size="12" font-weight="500" fill="#1a7f5a" text-anchor="middle">Tap a statement to open it</text>
  <text x="200" y="742" font-size="10" fill="#5f6368" text-anchor="middle">Most banks show monthly PDFs here</text>
</svg>
