<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" width="400" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Phone frame -->
  <rect x="0" y="0" width="400" height="760" rx="32" fill="#202124"/>
  <rect x="8" y="8" width="384" height="744" rx="26" fill="#f5f7fa"/>

  <!-- Status bar -->
  <rect x="8" y="8" width="384" height="28" fill="#ffffff"/>
  <text x="24" y="26" font-size="12" font-weight="600" fill="#202124">9:41</text>
  <circle cx="370" cy="22" r="4" fill="#202124"/>
  <rect x="350" y="18" width="14" height="8" rx="1" fill="none" stroke="#202124" stroke-width="1"/>
  <rect x="352" y="20" width="9" height="4" fill="#202124"/>

  <!-- Document viewer top bar -->
  <rect x="8" y="36" width="384" height="52" fill="#ffffff"/>
  <line x1="8" y1="88" x2="392" y2="88" stroke="#e8eaed"/>
  <text x="24" y="70" font-size="22" font-weight="500" fill="#1a7f5a">←</text>
  <text x="52" y="68" font-size="15" font-weight="600" fill="#202124">April 2026 Statement</text>
  <text x="52" y="82" font-size="11" fill="#5f6368">Checking • ****4821</text>

  <!-- PDF document preview area -->
  <rect x="8" y="88" width="384" height="572" fill="#e8eaed"/>
  <rect x="32" y="108" width="336" height="532" rx="4" fill="#ffffff" filter="url(#docShadow)"/>
  <defs>
    <filter id="docShadow" x="-4%" y="-2%" width="108%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Mini statement content inside PDF -->
  <rect x="48" y="124" width="304" height="36" fill="#1a7f5a" rx="2"/>
  <text x="200" y="147" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Monthly Account Statement</text>
  <text x="56" y="178" font-size="10" fill="#5f6368">Account: Checking ****4821</text>
  <text x="56" y="194" font-size="10" fill="#5f6368">Statement period: Mar 25 – Apr 24, 2026</text>
  <line x1="56" y1="206" x2="344" y2="206" stroke="#e8eaed"/>
  <text x="56" y="224" font-size="9" font-weight="700" fill="#5f6368">DATE</text>
  <text x="140" y="224" font-size="9" font-weight="700" fill="#5f6368">DESCRIPTION</text>
  <text x="320" y="224" font-size="9" font-weight="700" fill="#5f6368" text-anchor="end">AMOUNT</text>
  <line x1="56" y1="230" x2="344" y2="230" stroke="#e8eaed"/>
  <text x="56" y="248" font-size="9" fill="#202124">04/02</text>
  <text x="140" y="248" font-size="9" fill="#202124">Direct Deposit — Payroll</text>
  <text x="320" y="248" font-size="9" fill="#1a7f5a" text-anchor="end">+$2,450.00</text>
  <text x="56" y="264" font-size="9" fill="#202124">04/05</text>
  <text x="140" y="264" font-size="9" fill="#202124">Grocery Store</text>
  <text x="320" y="264" font-size="9" fill="#c5302d" text-anchor="end">-$87.42</text>
  <text x="56" y="280" font-size="9" fill="#202124">04/08</text>
  <text x="140" y="280" font-size="9" fill="#202124">Electric Utility</text>
  <text x="320" y="280" font-size="9" fill="#c5302d" text-anchor="end">-$124.18</text>
  <text x="56" y="296" font-size="9" fill="#202124">04/12</text>
  <text x="140" y="296" font-size="9" fill="#202124">Gas Station</text>
  <text x="320" y="296" font-size="9" fill="#c5302d" text-anchor="end">-$52.30</text>
  <text x="56" y="312" font-size="9" fill="#202124">04/15</text>
  <text x="140" y="312" font-size="9" fill="#202124">Online Transfer</text>
  <text x="320" y="312" font-size="9" fill="#c5302d" text-anchor="end">-$200.00</text>
  <text x="56" y="328" font-size="9" fill="#202124">04/18</text>
  <text x="140" y="328" font-size="9" fill="#202124">Restaurant</text>
  <text x="320" y="328" font-size="9" fill="#c5302d" text-anchor="end">-$43.67</text>
  <text x="56" y="344" font-size="9" fill="#202124">04/22</text>
  <text x="140" y="344" font-size="9" fill="#202124">ATM Withdrawal</text>
  <text x="320" y="344" font-size="9" fill="#c5302d" text-anchor="end">-$100.00</text>
  <line x1="56" y1="358" x2="344" y2="358" stroke="#e8eaed"/>
  <text x="56" y="376" font-size="9" fill="#5f6368">Ending balance</text>
  <text x="320" y="376" font-size="10" font-weight="700" fill="#202124" text-anchor="end">$3,247.18</text>
  <!-- Faded rows below fold -->
  <rect x="48" y="392" width="304" height="200" fill="#ffffff" opacity="0.6"/>
  <line x1="56" y1="410" x2="344" y2="410" stroke="#f0f0f0"/>
  <line x1="56" y1="430" x2="344" y2="430" stroke="#f0f0f0"/>
  <line x1="56" y1="450" x2="344" y2="450" stroke="#f0f0f0"/>
  <line x1="56" y1="470" x2="344" y2="470" stroke="#f0f0f0"/>
  <line x1="56" y1="490" x2="344" y2="490" stroke="#f0f0f0"/>
  <line x1="56" y1="510" x2="344" y2="510" stroke="#f0f0f0"/>
  <line x1="56" y1="530" x2="344" y2="530" stroke="#f0f0f0"/>
  <line x1="56" y1="550" x2="344" y2="550" stroke="#f0f0f0"/>
  <line x1="56" y1="570" x2="344" y2="570" stroke="#f0f0f0"/>
  <text x="200" y="610" font-size="9" fill="#bdc1c6" text-anchor="middle">Page 1 of 3</text>

  <!-- Bottom toolbar (iOS-style action bar) -->
  <rect x="8" y="660" width="384" height="92" fill="#ffffff"/>
  <line x1="8" y1="660" x2="392" y2="660" stroke="#e8eaed"/>
  <!-- Done button (left) -->
  <text x="40" y="708" font-size="16" font-weight="500" fill="#1a7f5a">Done</text>
  <!-- Share button (center-right — highlighted) -->
  <g transform="translate(298, 682)">
    <circle cx="22" cy="22" r="28" fill="#e6f3ec" stroke="#1a7f5a" stroke-width="2"/>
    <!-- iOS square.and.arrow.up share icon -->
    <g transform="translate(10, 8)">
      <rect x="4" y="10" width="16" height="14" rx="2" fill="none" stroke="#1a7f5a" stroke-width="2"/>
      <path d="M12 10 V4 M12 4 L8 8 M12 4 L16 8" stroke="#1a7f5a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Print icon (far right, muted) -->
  <g transform="translate(352, 690)" opacity="0.35">
    <rect x="2" y="6" width="16" height="12" rx="1" fill="none" stroke="#5f6368" stroke-width="1.5"/>
    <rect x="6" y="2" width="8" height="6" rx="1" fill="none" stroke="#5f6368" stroke-width="1.5"/>
    <line x1="6" y1="14" x2="14" y2="14" stroke="#5f6368" stroke-width="1.5"/>
  </g>
</svg>
