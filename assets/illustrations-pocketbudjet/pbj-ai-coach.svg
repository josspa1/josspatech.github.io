<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="400" height="760" rx="32" fill="#EDF2F7"/>
  <text x="200" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#1A4F7A" font-family="Georgia,serif">Financial Coach</text>
  <text x="200" y="72" text-anchor="middle" font-size="12" fill="#5A7A9A">Settings &rarr; Financial Coach</text>
  <rect x="24" y="95" width="352" height="90" rx="12" fill="#FBF7E9" stroke="#F0C040" stroke-width="2"/>
  <text x="44" y="125" font-size="13" font-weight="700" fill="#1A4F7A">Today&apos;s insight</text>
  <text x="44" y="150" font-size="12" fill="#5A7A9A">Dining is 18% over pace &mdash; slow down this week.</text>
  <rect x="24" y="200" width="352" height="280" rx="14" fill="#fff"/>
  <text x="44" y="230" font-size="12" font-weight="700" fill="#5A7A9A">ASK YOUR COACH</text>
  <rect x="44" y="245" width="260" height="36" rx="18" fill="#E8F0FE"/>
  <text x="60" y="268" font-size="13" fill="#1A4F7A">How much did I spend on gas?</text>
  <rect x="44" y="300" width="312" height="80" rx="10" fill="#F5F7FA"/>
  <text x="56" y="325" font-size="12" fill="#1A4F7A">You spent $186 on Gas last month,</text>
  <text x="56" y="345" font-size="12" fill="#1A4F7A">down 12% from the month before.</text>
  <text x="56" y="365" font-size="11" fill="#5A7A9A">Uses anonymized summaries only.</text>
  <rect x="44" y="400" width="312" height="36" rx="18" fill="#fff" stroke="#1A4F7A" stroke-width="2"/>
  <text x="200" y="423" text-anchor="middle" font-size="13" fill="#5A7A9A">Type a question...</text>
  <rect x="24" y="500" width="352" height="56" rx="12" fill="#fff"/>
  <text x="44" y="532" font-size="13" fill="#1A4F7A">&#10003; Opt-in &bull; disable anytime in Settings</text>
</svg>
