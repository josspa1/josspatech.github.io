<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1" />
<title>Share → PocketBudJet — mock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 390px;
    height: 844px;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    margin: 0;
  }
  .phone {
    width: 390px;
    height: 844px;
    background: #fff;
    color: #0f1b2d;
    position: relative;
    overflow: hidden;
  }
  .dim {
    position: absolute; inset: 0;
    background: rgba(10, 18, 32, 0.45);
    z-index: 1;
  }
  .bg-hint {
    padding: 48px 16px 0;
    opacity: 0.55;
  }
  .bg-hint h1 { font-size: 22px; margin-bottom: 8px; }
  .bg-hint .row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #e8edf3;
    font-size: 14px;
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 20px 20px 0 0;
    z-index: 2;
    padding: 10px 16px 28px;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
  }
  .handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: #c9d0da; margin: 4px auto 14px;
  }
  .sheet h2 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .app {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 4px;
    border-bottom: 1px solid #eef2f7;
  }
  .app:last-child { border-bottom: 0; }
  .icon {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px; color: #fff;
  }
  .icon.msg { background: #8a93a3; }
  .icon.mail { background: #a05a4a; }
  .icon.pbj { background: #0d2b55; box-shadow: 0 0 0 3px #cfe0ff; }
  .app.pick {
    background: #f0f5ff;
    margin: 0 -8px;
    padding-left: 12px; padding-right: 12px;
    border-radius: 12px;
  }
  .label { font-size: 16px; font-weight: 600; }
  .sub { font-size: 12px; color: #5b6b80; margin-top: 2px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="bg-hint">
      <h1>Activity</h1>
      <div class="row"><span>PAYROLL DEPOSIT</span><span>+$2,450.00</span></div>
      <div class="row"><span>GREENLEAF MARKET</span><span>-$91.05</span></div>
      <div class="row"><span>STREAMLY *MONTHLY</span><span>-$15.49</span></div>
      <div class="row"><span>FITSPHERE GYM</span><span>-$29.00</span></div>
    </div>
    <div class="dim"></div>
    <div class="sheet">
      <div class="handle"></div>
      <h2>Share</h2>
      <div class="app"><div class="icon msg">M</div><div class="label">Messages</div></div>
      <div class="app"><div class="icon mail">G</div><div class="label">Gmail</div></div>
      <div class="app pick">
        <div class="icon pbj">PBJ</div>
        <div>
          <div class="label">PocketBudJet</div>
          <div class="sub">Import transactions</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
