<script>
(function () {
  var ref = document.referrer || '';
  var host = '';
  try { host = ref ? new URL(ref).hostname : ''; } catch (e) {}
  var body = JSON.stringify({
    page: '/t?utm_source=heycatch&utm_campaign=t',
    referrer_host: host.slice(0, 120),
    referrer_raw: ('utm:heycatch|social|t | ' + ref).slice(0, 500),

    session_id: Math.random().toString(36).slice(2, 10),
    source: 'tiktok'
  });
  try {
    navigator.sendBeacon(
      'https://josspatech.pockethost.io/api/collections/_site_visits/records',
      new Blob([body], { type: 'application/json' })
    );
  } catch (e) {}
  location.replace('/?utm_source=heycatch&utm_campaign=t');
})();
</script>
