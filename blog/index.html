    <p class="kicker"><img src="/assets/brand/josspatech-mark-app.svg?v=jt2star" width="56" height="56" alt="">Josspa<em>Tech</em></p>
    <h1>Blog</h1>
    <p class="lead">Guides for collectors and private budgeting — written for search and for the questions people actually ask.</p>
    <p class="empty" id="blog-empty">New articles land here as they publish. Check back soon.</p>

  <script src="/scripts/site-analytics-saas.js?v=12" defer></script>
  <script>
    fetch('/blog/posts.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (posts) {
        if (!Array.isArray(posts) || !posts.length) return;
        var list = document.getElementById('blog-list');
        var empty = document.getElementById('blog-empty');
        empty.hidden = true;
        list.hidden = false;
        posts.forEach(function (p) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.className = 'title';
          a.href = p.path;
          a.textContent = p.title;
          var meta = document.createElement('p');
          meta.className = 'meta';
          meta.textContent = (p.date || '') + (p.app ? ' · ' + p.app : '');
          var ex = document.createElement('p');
          ex.className = 'excerpt';
          ex.textContent = p.excerpt || '';
          li.appendChild(a);
          li.appendChild(meta);
          if (p.excerpt) li.appendChild(ex);
          list.appendChild(li);
        });
      })
      .catch(function () {});
  </script>
