    <p class="kicker"><img src="/assets/brand/josspatech-mark-app.svg?v=jt2star" width="56" height="56" alt="">JosspaTech</p>
    <h1>Blog</h1>
    <p class="howto-langs blog-langs" aria-label="Languages">

    <p class="lead">面向收藏者和私密预算管理的指南——为搜索而写，也为人们真正会问的问题而写。</p>
    <p class="empty" id="blog-empty">新文章发布后会出现在这里。请稍后再来看看。</p>
    <ul class="post-list" id="blog-list" hidden></ul>
  </main>
  <footer class="foot">
    <p><a href="/">JosspaTech 首页</a> · <a href="mailto:support@josspatech.com">support@josspatech.com</a></p>
  </footer>
  <script src="/scripts/site-analytics-saas.js?v=13" defer></script>
  <script>
    fetch('/blog/posts-zh.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (posts) {
        if (!Array.isArray(posts) || !posts.length) return;
        var list = document.getElementById('blog-list');
        var empty = document.getElementById('blog-empty');
        empty.hidden = true;
        list.hidden = false;
        posts.forEach(function (p) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.className = 'title';
          a.href = (p.path || '').replace(/\/$/, '') + '/zh/';
          a.textContent = p.title;
          var meta = document.createElement('p');
          meta.className = 'meta';
          meta.textContent = (p.date || '') + (p.app ? ' · ' + p.app : '');
          var ex = document.createElement('p');
          ex.className = 'excerpt';
          ex.textContent = p.excerpt || '';
          li.appendChild(a);
          li.appendChild(meta);
          if (p.excerpt) li.appendChild(ex);
          list.appendChild(li);
        });
      })
      .catch(function () {});
  </script>
