<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Get Handy Horology Helper</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #0c3358 0%, #1a4f7a 45%, #0a2438 100%);
      color: #f7f1ea; padding: 24px; text-align: center;
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 0.4rem; font-weight: 700; }
    p { margin: 0 0 1.25rem; opacity: 0.85; font-family: system-ui, sans-serif; font-size: 0.95rem; }
    .acts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn {
      display: inline-block; padding: 14px 22px; border-radius: 10px;
      background: #f0c040; color: #0c3358; font-family: system-ui, sans-serif;
      font-weight: 700; text-decoration: none; font-size: 0.95rem;
    }
    a.ghost {
      background: transparent; color: #f7f1ea; border: 1px solid rgba(247,241,234,0.45);
    }
    .note { margin-top: 1.25rem; font-size: 0.8rem; opacity: 0.65; font-family: system-ui, sans-serif; }
  </style>
  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=com.josspatech.handyhorology';
      // Until ASC Ready for Sale, iOS → site (App Store URL 404s / Meta Store ID won't stick).
      // Flip IOS_DEST back to apps.apple.com/us/app/id6778570480 when live.
      var IOS_STORE = 'https://apps.apple.com/us/app/id6778570480';
      var IOS_DEST = '/#hhh';
      var IOS_LIVE = false;
      var ua = navigator.userAgent || '';
      var q = location.search || '';
      function withUtm(url) {
        if (!q || q === '?') return url;
        return url + (url.indexOf('?') >= 0 ? '&' : '?') + q.replace(/^\?/, '');
      }
      function siteWithUtm() {
        // Keep UTMs on the query string; hash is the HHH section.
        if (!q || q === '?') return IOS_DEST;
        return '/' + q + '#hhh';
      }
      if (/Android/i.test(ua)) {
        location.replace(withUtm(PLAY));
        return;
      }
      if (/iPhone|iPad|iPod/i.test(ua)) {
        location.replace(IOS_LIVE ? withUtm(IOS_STORE) : siteWithUtm());
        return;
      }
      window.__HHH_GET__ = {
        play: withUtm(PLAY),
        ios: IOS_LIVE ? withUtm(IOS_STORE) : siteWithUtm(),
        iosLive: IOS_LIVE
      };
    })();
  </script>
</head>
<body>
  <main>
    <h1>Handy Horology Helper</h1>
    <p>Android opens Google Play. iPhone opens the Handy Horology page until the App Store listing is live.</p>
    <div class="acts">
      <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.josspatech.handyhorology">Google Play</a>
      <a class="btn" id="ios" href="/#hhh">Handy Horology on the web</a>
      <a class="btn ghost" href="/#hhh">Learn more</a>
    </div>
    <p class="note">Meta paid traffic · iOS → site until App Store Ready for Sale</p>
  </main>
  <script>
    if (window.__HHH_GET__) {
      document.getElementById('play').href = window.__HHH_GET__.play;
      document.getElementById('ios').href = window.__HHH_GET__.ios;
      if (!window.__HHH_GET__.iosLive) {
        document.getElementById('ios').textContent = 'Handy Horology on the web';
      }
    }
  </script>
</body>
</html>
