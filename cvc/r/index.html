<head>
<meta charset="utf-8">
<title>Curator's Vault — JosspaTech</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Curator's Vault">
<meta property="og:description" content="Identify coins, cards, stamps and more. Vault and worth on your phone.">
<meta property="og:url" content="https://josspatech.com/cvc/r">
<meta property="og:image" content="https://josspatech.com/assets/brand/og-josspatech.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="canonical" href="/cvc/?utm_source=reddit&utm_medium=social&utm_campaign=r&utm_content=cvc">
<script>
(function () {
  // App + channel short hop (same UTM pattern as /cw). Bio links stay /t /f /i → hub.
  var hop = '/cvc/r';
  var dest = '/cvc/?utm_source=reddit&utm_medium=social&utm_campaign=r&utm_content=cvc';
  var ref = document.referrer || '';
  var host = '';
  try { host = ref ? new URL(ref).hostname : ''; } catch (e) {}
  var body = JSON.stringify({
    page: hop,
    referrer_host: (host || 'www.reddit.com').slice(0, 120),
    referrer_raw: ('utm:reddit|social|r|cvc | ' + ref).slice(0, 500),
    user_agent: (navigator.userAgent || '').slice(0, 300),
    session_id: Math.random().toString(36).slice(2, 10),
    source: 'reddit'
  });
  try {
    navigator.sendBeacon(
      'https://josspatech.pockethost.io/api/collections/_site_visits/records',
      new Blob([body], { type: 'text/plain;charset=UTF-8' })
    );
  } catch (e) {}
  location.replace(dest);
})();
</script>
</head>
<body>

</body>
