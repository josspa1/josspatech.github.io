  <meta name="description" content="Short overview of Handy Horology Helper — museum, AI Identify, Clockworks, Grail Radar, finances, Web Companion, and Pro.">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --burgundy: #5B2333;
      --burgundy-dark: #3D1522;
      --gold: #C8AA6E;
      --cream: #F5EDE4;
      --phone-ar: 1440 / 3120;
    }
    body {
      font-family: 'Source Sans 3', sans-serif;
      background: linear-gradient(160deg, #1a2a3a 0%, #0f1f2f 55%, #3D1522 100%);
      color: #fff;
      min-height: 100vh;
    }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 1.35rem; background: rgba(0,0,0,0.35);
      border-bottom: 1px solid rgba(200,170,110,0.15);
    }
    .top a { color: var(--gold); text-decoration: none; font-weight: 600; font-size: 0.92rem; }
    .top h1 { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; }
    .top .meta { font-size: 0.85rem; opacity: 0.8; }
    .stage-wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    .stage {
      position: relative; width: 100%; min-height: 780px;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(91,35,51,0.45) 0%, rgba(10,20,30,0.9) 70%);
      border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(200,170,110,0.12);
    }
    .slide {
      position: absolute; inset: 0; opacity: 0; transition: opacity 0.55s ease;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      padding: 1.5rem;
    }
    .slide.active { opacity: 1; z-index: 2; }
    .phone {
      width: min(380px, 70vw);
      aspect-ratio: var(--phone-ar);
      border-radius: clamp(20px, 5vw, 30px);
      background: #000; overflow: hidden;
      box-shadow: 0 18px 48px rgba(0,0,0,0.45);
      flex-shrink: 0;
    }
    .phone img {
      width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block;
    }
    .caption {
      margin-top: 1.1rem; max-width: 36rem; text-align: center;
      font-size: 1.05rem; line-height: 1.45; color: rgba(255,255,255,0.92);
      min-height: 3.2em;
    }
    .caption strong { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 1.15rem; display: block; margin-bottom: 0.25rem; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: center;
      margin-top: 1.25rem;
    }
    .btn {
      background: var(--burgundy); color: #fff; border: 1px solid rgba(200,170,110,0.35);
      border-radius: 999px; padding: 0.55rem 1.2rem; font-weight: 700; cursor: pointer;
      font-family: inherit; font-size: 0.95rem;
    }
    .btn:hover { background: var(--burgundy-dark); border-color: var(--gold); }
    .btn.gold { background: var(--gold); color: var(--burgundy-dark); border-color: var(--gold); }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; background: rgba(200,170,110,0.25);
      border: none; cursor: pointer; padding: 0;
    }
    .dot.active { background: var(--gold); }
    .links {
      display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem;
      font-size: 0.95rem;
    }
    .links a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .stage { min-height: 640px; }
      .phone { width: min(300px, 78vw); }
      .caption { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="top">
    <a href="/#hhh">← Handy Horology Helper</a>
    <h1>HHH Intro</h1>
    <span class="meta">English · ~1 min</span>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage" aria-live="polite">
      <!-- slides injected -->
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Walkthrough slides"></div>
    <div class="controls">
      <button type="button" class="btn" id="prevBtn" aria-label="Previous slide">← Prev</button>
      <button type="button" class="btn gold" id="playBtn" aria-label="Play walkthrough">▶ Play</button>
      <button type="button" class="btn" id="nextBtn" aria-label="Next slide">Next →</button>
      <button type="button" class="btn" id="voiceBtn" aria-label="Toggle narration" title="Narration on/off">🔊</button>
    </div>
    <div class="links">
      <a href="/videos/hhh/user-guide/">Open User Guide →</a>
      <a href="/docs/handyhorology/HandyHorology_UserGuide.pdf">PDF</a>
      <a href="https://play.google.com/apps/testing/com.josspatech.handyhorology">Play open testing</a>
      ·
      <a href="https://testflight.apple.com/join/AcmCPPVC">iOS TestFlight</a>
    </div>
  </div>

  <script>
  (function () {
    var SLIDES = [
      {
        img: '/assets/screenshots/hhh/intro/01-command-center.png',
        title: 'Command Center',
        line: 'Your collection’s command center — museum, hunt, and repair in one place.'
      },
      {
        img: '/assets/screenshots/hhh/intro/02-my-museum.png',
        title: 'My Museum',
        line: 'My Museum keeps every watch and clock with value at a glance.'
      },
      {
        img: '/assets/screenshots/hhh/intro/03-piece-detail.png',
        title: 'Piece detail',
        line: 'Open any piece for provenance, service history, and what it’s worth.'
      },
      {
        img: '/assets/screenshots/hhh/intro/04-ai-identify.png',
        title: 'AI Identify',
        line: 'Snap a photo — AI Identify names the piece and scores the match.'
      },
      {
        img: '/assets/screenshots/hhh/intro/05-clockworks-repair.png',
        title: 'Clockworks & repair',
        line: 'Stuck clocks? Symptom wizard plus Clockworks parts in a few taps.'
      },
      {
        img: '/assets/screenshots/hhh/intro/06-grail-radar.png',
        title: 'Grail Radar',
        line: 'Grail Radar watches eBay so the next grail finds you.'
      },
      {
        img: '/assets/screenshots/hhh/intro/07-finances-pl.png',
        title: 'Finances',
        line: 'See profit, cost basis, and portfolio health — not just a pretty list.'
      },
      {
        img: '/assets/screenshots/hhh/intro/08-pro-tools.png',
        title: 'Pro tools',
        line: 'Pro tools, Photo Coach, Offline Show Pack, and Device Sync when you need them.'
      },
      {
        img: '/assets/screenshots/hhh/intro/09-web-companion.png',
        title: 'Web Companion',
        line: 'Web Companion opens your museum on a PC — same Wi‑Fi, address + 4-digit code.'
      },
      {
        img: '/assets/screenshots/hhh/intro/10-trial-pro.png',
        title: 'Start free',
        line: 'Start free — unlock Pro when you’re ready to go deeper.'
      }
    ];

    var stage = document.getElementById('stage');
    var dotsEl = document.getElementById('dots');
    var current = 0;
    var playing = false;
    var voiceOn = true;
    var timer = null;
    var audioEl = null;
    var FALLBACK_MS = 6500;
    var POST_AUDIO_MS = 600;

    SLIDES.forEach(function (s, i) {
      var slide = document.createElement('div');
      slide.className = 'slide' + (i === 0 ? ' active' : '');
      slide.dataset.index = String(i);
      slide.innerHTML =
        '<div class="phone"><img src="' + s.img + '" alt="' + s.title + '" loading="' + (i < 2 ? 'eager' : 'lazy') + '"></div>' +
        '<p class="caption"><strong>' + s.title + '</strong>' + s.line + '</p>';
      stage.appendChild(slide);

      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      dot.addEventListener('click', function () { stopPlay(); goTo(i); });
      dotsEl.appendChild(dot);
    });

    var slides = stage.querySelectorAll('.slide');
    var dots = dotsEl.querySelectorAll('.dot');
    var playBtn = document.getElementById('playBtn');
    var voiceBtn = document.getElementById('voiceBtn');

    function stopAudio() {
      if (audioEl) {
        audioEl.onended = null;
        audioEl.onerror = null;
        try { audioEl.pause(); } catch (_) {}
        audioEl = null;
      }
    }

    function playNarration(i, onDone) {
      stopAudio();
      if (!voiceOn) {
        timer = setTimeout(onDone, FALLBACK_MS);
        return;
      }
      var src = 'audio/slide-' + i + '.mp3';
      var a = new Audio(src);
      audioEl = a;
      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        timer = setTimeout(onDone, POST_AUDIO_MS);
      }
      a.onended = finish;
      a.onerror = function () {
        clearTimeout(timer);
        timer = setTimeout(onDone, FALLBACK_MS);
      };
      // Safety if metadata missing / stalled
      timer = setTimeout(finish, FALLBACK_MS + 4000);
      var p = a.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function () {
          clearTimeout(timer);
          timer = setTimeout(onDone, FALLBACK_MS);
        });
      }
    }

    function goTo(i, opts) {
      opts = opts || {};
      current = (i + SLIDES.length) % SLIDES.length;
      slides.forEach(function (el, j) { el.classList.toggle('active', j === current); });
      dots.forEach(function (el, j) { el.classList.toggle('active', j === current); });
      if (opts.fromPlay) return;
      stopAudio();
      clearTimeout(timer);
    }

    function stopPlay() {
      playing = false;
      clearTimeout(timer);
      stopAudio();
      playBtn.textContent = '▶ Play';
    }

    function advanceFromPlay() {
      if (!playing) return;
      if (current >= SLIDES.length - 1) {
        stopPlay();
        return;
      }
      goTo(current + 1, { fromPlay: true });
      playNarration(current, advanceFromPlay);
    }

    function startPlay() {
      playing = true;
      playBtn.textContent = '❚❚ Pause';
      playNarration(current, advanceFromPlay);
    }

    document.getElementById('prevBtn').addEventListener('click', function () {
      stopPlay();
      goTo(current - 1);
    });
    document.getElementById('nextBtn').addEventListener('click', function () {
      stopPlay();
      goTo(current + 1);
    });
    playBtn.addEventListener('click', function () {
      if (playing) stopPlay();
      else startPlay();
    });
    voiceBtn.addEventListener('click', function () {
      voiceOn = !voiceOn;
      voiceBtn.textContent = voiceOn ? '🔊' : '🔇';
      voiceBtn.title = voiceOn ? 'Narration on' : 'Narration off';
      if (!voiceOn) stopAudio();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { stopPlay(); goTo(current + 1); }
      if (e.key === 'ArrowLeft') { stopPlay(); goTo(current - 1); }
      if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
    });
  })();
  </script>
<script src="/scripts/site-analytics-saas.js" defer></script>
</body>
